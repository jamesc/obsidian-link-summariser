[project]
name = "summarize-links"
version = "0.1.0"
description = "A CLI tool to summarize web links from Obsidian daily notes using Google Gemini AI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "James" }
]
keywords = ["obsidian", "gemini", "ai", "summarizer", "cli"]

dependencies = [
    "google-genai>=0.1.0",
    "openai>=1.3.0",
    "pydantic>=2.0",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "pyyaml>=6.0",
    "html5lib>=1.1",
    "tenacity>=9.1.2",
    "brotli>=1.0",
    "langfuse>=2.0.0",
    "playwright>=1.40.0",
    "textual>=7.3.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
    "mypy>=1.13",
    "types-requests>=2.32",
    "types-beautifulsoup4>=4.12",
    "types-PyYAML>=6.0",
]

[project.scripts]
summarize-links = "summarize_links.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["SIM117"]  # Allow nested with statements for clarity

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "integration: marks tests as integration tests (require real API credentials, deselect with '-m \"not integration\"')",
]

[dependency-groups]
dev = [
    "pytest-mock>=3.15.1",
]
